{% extends 'base.html' %}

{% block content %}
<div class="pt-4 pb-2 mb-4">
    <h2 class="fw-bold mb-0">급여 계산식</h2>
    <p class="text-muted mt-1" style="font-size:13px;">급여 산출에 사용되는 계산 기준을 정리합니다.</p>
</div>

<div class="row g-4">
    <div class="col-12">
        <div class="card shadow-sm border-0">
            <div class="card-body py-5 text-center text-muted">
                <i class="fas fa-calculator fa-3x mb-3" style="color:#cbd5e1;"></i>
                <p class="mb-0" style="font-size:15px;">준비 중인 페이지입니다.</p>
                <p class="mt-1" style="font-size:13px;">계산식 항목은 별도로 안내드릴 예정입니다.</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
