<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - ERP SYSTEM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin="crossorigin" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"/>
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f1f5f9;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        .login-header {
            background-color: #1e293b;
            color: white;
            padding: 2.5rem 2rem;
            text-align: center;
        }
        .login-body {
            padding: 2.5rem 2rem;
            background: white;
        }
        .btn-primary {
            background-color: #3b82f6;
            border: none;
            padding: 12px;
            font-weight: 600;
        }
        .btn-primary:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <h3 class="fw-bold m-0">ERP SYSTEM</h3>
            <p class="mb-0 mt-2 opacity-75 small">Enterprise Resource Planning</p>
        </div>
        <div class="login-body">
            <!-- Django LoginView와 연결될 폼 -->
            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="username" class="form-label fw-bold text-secondary small">아이디</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="아이디를 입력하세요" required autofocus>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label fw-bold text-secondary small">비밀번호</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="비밀번호를 입력하세요" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 rounded-3">로그인</button>
            </form>
            {% if form.errors %}
            <div class="alert alert-danger mt-3 mb-0 py-2 text-center small">
                아이디 또는 비밀번호를 확인해주세요.
            </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
